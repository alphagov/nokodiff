name: Percy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
jobs:
  percy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spec/dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          working-directory: spec/dummy
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/* # use the latest LTS release
      - run: npm ci
      - run: bin/rails dartsass:build
      - run: npx percy exec -- bundle exec rspec spec/visual_regression_spec.rb
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

name: Percy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
jobs:
  percy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spec/dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          working-directory: spec/dummy
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/* # use the latest LTS release
      - run: npm ci
      - run: bin/rails dartsass:build
      - run: npx percy exec -- bundle exec rspec spec/visual_regression_spec.rb
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
